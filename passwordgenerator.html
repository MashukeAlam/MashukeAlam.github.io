<body>
    <nav style="padding: 12px 20px; background: #18181b; border-bottom: 1px solid #27272a; margin-bottom: 20px;">
        <a href="index.html" style="color: #10b981; font-weight: 600; text-decoration: none;">&larr; Back to Portfolio</a>
    </nav>


    <div>
        <div class="container_feild">
            <span id="result"></span>
            <button onclick="copyPass()"  id="copyBtn" style="font-size:24px"><i class="fa fa-copy"></i></button>
        </div>
        <div class="passLen">
            <label>Password Length</label>
            <input type="number" id="length" min='4' max='20' value='20' />
        </div>
        <div class="capsDiv">
            <label>Allow Caps ?</label>
            <input id="cap" type="checkbox" name="" class="checkbox" checked="true">
        </div>
        <div class="smallDiv">
            <label>Allow Small ?</label>
            <input id="sml" type="checkbox" name="" class="checkbox" checked="true">
        </div>
        <div class="numsDiv">
            <label>Allow Numbers ?</label>
            <input id="num" type="checkbox" name="" class="checkbox" checked="true">
        </div>
        <div class="symDiv">
            <label>Allow Symbols ?</label>
            <input id="sym" type="checkbox" name="" class="checkbox">
        </div>
        <button id="genPass" onclick="init()">Generate Password</button>
    </div>
